<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Card Selection Demo</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background-color: #333;
            color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #fff;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
        }
        .input-section {
            background: #444;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            color: #ddd;
        }
        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            background: #555;
            border: 1px solid #666;
            color: #fff;
            border-radius: 4px;
        }
        .white-balls {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: #666;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background: #777;
        }
        .cards-display {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        .card {
            background: #444;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .card-position {
            font-size: 14px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .card-name {
            font-size: 18px;
            color: #fff;
            margin: 10px 0;
            min-height: 40px;
        }
        .card-id {
            font-size: 12px;
            color: #888;
        }
        .card img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 4px;
            border: 2px solid #666;
        }
        .seed-info {
            background: #555;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
            font-size: 12px;
            color: #ccc;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>🔮 Tarot Card Selection Demo</h1>
    <p class="subtitle">Deterministic card selection based on lottery numbers</p>
    
    <div class="input-section">
        <h2>Enter Lottery Numbers</h2>
        <label>White Ball Numbers (1-69):</label>
        <div class="white-balls">
            <input type="number" id="wb1" min="1" max="69" value="5" placeholder="1-69">
            <input type="number" id="wb2" min="1" max="69" value="12" placeholder="1-69">
            <input type="number" id="wb3" min="1" max="69" value="23" placeholder="1-69">
            <input type="number" id="wb4" min="1" max="69" value="45" placeholder="1-69">
            <input type="number" id="wb5" min="1" max="69" value="67" placeholder="1-69">
        </div>
        
        <label for="pb">Powerball (1-26):</label>
        <input type="number" id="pb" min="1" max="26" value="13" placeholder="1-26">
        
        <label for="question">Your Question:</label>
        <input type="text" id="question" maxlength="200" value="What does my future hold?" placeholder="Enter your question...">
        
        <button onclick="selectCards()">Select Cards</button>
        
        <div id="seed-display" class="seed-info" style="display: none;">
            <strong>Seed:</strong> <span id="seed-text"></span>
        </div>
    </div>
    
    <div id="cards-container"></div>

    <!-- Load dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/seedrandom@3/seedrandom.min.js"></script>
    <script src="js/tarot-deck.js"></script>
    <script src="js/tarot.js"></script>
    
    <script>
        const tarotModule = new TarotModule();
        
        function selectCards() {
            // Get lottery numbers
            const whiteBalls = [
                parseInt(document.getElementById('wb1').value),
                parseInt(document.getElementById('wb2').value),
                parseInt(document.getElementById('wb3').value),
                parseInt(document.getElementById('wb4').value),
                parseInt(document.getElementById('wb5').value)
            ];
            const powerball = parseInt(document.getElementById('pb').value);
            const question = document.getElementById('question').value;
            
            // Validate inputs
            if (whiteBalls.some(isNaN) || isNaN(powerball) || !question.trim()) {
                alert('Please fill in all fields');
                return;
            }
            
            const lotteryNumbers = { whiteBalls, powerball };
            
            // Select cards
            const cards = tarotModule.selectCards(lotteryNumbers, question);
            
            // Display seed
            const seed = tarotModule.createSeed(lotteryNumbers, question);
            document.getElementById('seed-text').textContent = seed;
            document.getElementById('seed-display').style.display = 'block';
            
            // Display cards
            displayCards(cards);
        }
        
        function displayCards(cards) {
            const container = document.getElementById('cards-container');
            
            let html = '<div class="cards-display">';
            cards.forEach(card => {
                html += `
                    <div class="card">
                        <div class="card-position">${card.position}</div>
                        <img src="${card.imageUrl}" alt="${card.name}" onerror="this.style.display='none'">
                        <div class="card-name">${card.name}</div>
                        <div class="card-id">ID: ${card.id} | ${card.arcana} arcana${card.suit ? ' - ' + card.suit : ''}</div>
                    </div>
                `;
            });
            html += '</div>';
            
            container.innerHTML = html;
        }
        
        // Auto-select on page load
        window.addEventListener('load', () => {
            selectCards();
        });
    </script>
</body>
</html>
